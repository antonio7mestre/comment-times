name: Daily Comment Times scrape

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Keep scheduled runs at 6am Los Angeles
        if: github.event_name == 'schedule'
        run: |
          if [ "$(TZ=America/Los_Angeles date +%H)" != "06" ]; then
            echo "Not 6am America/Los_Angeles; this schedule exists only to handle daylight saving time."
            exit 0
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Scrape comments
        env:
          NYT_COOKIE: ${{ secrets.NYT_COOKIE }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          WSJ_COOKIE: ${{ secrets.WSJ_COOKIE }}
        run: npm run scrape:daily:force

      - name: Build static site
        run: npm run build

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Update Comment Times data"
          git push
