services:
  - type: web
    name: comment-times
    env: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: cron
    name: comment-times-daily-scrape-pdt
    env: node
    schedule: "0 13 * * *"
    buildCommand: npm run build
    startCommand: npm run scrape:daily
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NYT_COOKIE
        sync: false
      - key: WSJ_COOKIE
        sync: false
      - key: SCRAPE_DEEP
        value: "1"
      - key: SCRAPE_PAST_24H
        value: "1"

  - type: cron
    name: comment-times-daily-scrape-pst
    env: node
    schedule: "0 14 * * *"
    buildCommand: npm run build
    startCommand: npm run scrape:daily
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NYT_COOKIE
        sync: false
      - key: WSJ_COOKIE
        sync: false
      - key: SCRAPE_DEEP
        value: "1"
      - key: SCRAPE_PAST_24H
        value: "1"
